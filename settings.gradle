pluginManagement {
    repositories {
        // Official repositories first. The Aliyun mirrors this project originally used
        // return 502 for org.bouncycastle and org.slf4j, which fails configuration before
        // any task runs. They are kept only as a last-resort fallback.
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

rootProject.name = "NexusClone"

include ':app'
include ':Bcore'
